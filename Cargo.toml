[workspace]
resolver = "2"
members = [
    "crates/apex-core",
    "crates/apex-graph",
    "crates/apex-scheduler",
    "crates/apex-serialization",
    "crates/apex-hot-reload",
    "crates/apex-isolated",
    "crates/apex-examples",
    "crates/apex-bench",
    "crates/apex-macros",
    "crates/apex-scripting",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["You"]
license = "MIT"

[workspace.dependencies]
# Хэширование
rustc-hash = "2.1"

# Маленькие vec на стеке
smallvec = { version = "1.11", features = ["union"] }

# Arena allocation
thunderdome = "0.6"

# Битовые множества
bitvec = "1.0"

# Параллелизм
rayon = "1.8"

# Логирование
log = "0.4"

# Ошибки
thiserror = "2.0"

# Сериализация
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode    = "1.3"

# Математика для трансформаций
glam = { version = "0.32", features = ["serde"] }

# Каналы для WorldBridge
crossbeam-channel = "0.5"

# Скриптинг — Lua 5.4 через mlua
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# Внешний impl Component для cgmath::Matrix4<f32> (опционально)
cgmath = "0.18"

# Авторегистрация компонентов через distributed slice
linkme = "0.3"

# Compile-fail тесты макросов (derive/system!) — trybuild
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1