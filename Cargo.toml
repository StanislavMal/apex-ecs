[workspace]
resolver = "2"
members = [
    "crates/apex-core",
    "crates/apex-graph",
    "crates/apex-scheduler",
    "crates/apex-serialization",
    "crates/apex-hot-reload",
    "crates/apex-isolated",
    "crates/apex-examples",
    "crates/apex-bench",
    "crates/apex-macros",
    "crates/apex-scripting",
    "crates/apex-test-dir",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["You"]
license = "MIT"

[workspace.dependencies]
# Hashing
rustc-hash = "2.1"

# Small on-stack vectors
smallvec = { version = "1.11", features = ["union"] }

# Arena allocation
thunderdome = "0.6"

# Bit sets
bitvec = "1.0"

# Parallelism
rayon = "1.8"

# Logging
log = "0.4"

# Errors
thiserror = "2.0"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: a float read from a text document is the float that was written, to the last
# bit. Without it the parser rounds approximately, and a load followed by a save moves a coordinate
# by an ulp (gate `a_float_survives_the_text_document_to_the_last_bit`, engine TD-608). Cargo
# unifies features, so this holds for every crate of a build that includes the core.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Retired binary format: read-only, for documents written before wire v4 (engine TD-608,
# removed 2026-12-17). New binary data is `postcard`.
bincode    = "1.3"
# Binary format of snapshots, diffs, binary components and events between worlds. The wire
# format is stable across 1.x by its specification.
postcard   = { version = "1.1", default-features = false, features = ["use-std"] }

# Math for transforms
glam = { version = "0.32", features = ["serde"] }

# Channels for WorldBridge
crossbeam-channel = "0.5"

# Scripting — Lua 5.4 via mlua. `serialize` powers the serde-tree component
# access (`get_component`/`set_component` Lua globals, RT-2): mlua::Value ↔
# serde_json::Value conversion via LuaSerdeExt.
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }

# External impl Component for cgmath::Matrix4<f32> (optional)
cgmath = "0.18"

# Component auto-registration via distributed slice
linkme = "0.3"

# Compile-fail tests for the macros (derive/system!) — trybuild
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1