[workspace]
resolver = "2"
members = [
    "crates/apex-core",
    "crates/apex-graph",
    "crates/apex-scheduler",
    "crates/apex-serialization",
    "crates/apex-hot-reload",
    "crates/apex-isolated",
    "crates/apex-examples",
    "crates/apex-bench",
    "crates/apex-macros",
    "crates/apex-scripting",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["You"]
license = "MIT"

[workspace.dependencies]
# Hashing
rustc-hash = "2.1"

# Small on-stack vectors
smallvec = { version = "1.11", features = ["union"] }

# Arena allocation
thunderdome = "0.6"

# Bit sets
bitvec = "1.0"

# Parallelism
rayon = "1.8"

# Logging
log = "0.4"

# Errors
thiserror = "2.0"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode    = "1.3"

# Math for transforms
glam = { version = "0.32", features = ["serde"] }

# Channels for WorldBridge
crossbeam-channel = "0.5"

# Scripting — Lua 5.4 via mlua
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# External impl Component for cgmath::Matrix4<f32> (optional)
cgmath = "0.18"

# Component auto-registration via distributed slice
linkme = "0.3"

# Compile-fail tests for the macros (derive/system!) — trybuild
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1