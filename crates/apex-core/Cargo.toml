[package]
name = "apex-core"
publish = false
version.workspace = true
edition.workspace = true

[features]
default  = []
cgmath = ["dep:cgmath"]

[dependencies]
apex-graph = { path = "../apex-graph" }

rustc-hash.workspace  = true
smallvec.workspace    = true
thunderdome.workspace = true
bitvec.workspace      = true
thiserror.workspace   = true
log.workspace         = true
rayon.workspace = true

# Component auto-registration
linkme.workspace = true
apex-macros = { path = "../apex-macros" }

# Serialization — needed for the Serializable trait and make_serde_fns
serde      = { workspace = true }
serde_json = { workspace = true }
postcard   = { workspace = true }
# Legacy reader only (payloads of wire v3 and older), removed with engine TD-608.
bincode    = { workspace = true }

# Math for transforms
glam = { workspace = true }
cgmath = { workspace = true, optional = true }

[dev-dependencies]
# Compile-fail tests for derive/`system!` migrant traps
trybuild = { workspace = true }