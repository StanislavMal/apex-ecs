[package]
name = "apex-bench"
version.workspace = true
edition.workspace = true

[features]
default = ["apex"]
apex = ["apex-core/cgmath"]
flecs = []
bevy = ["dep:bevy_ecs", "dep:bevy_tasks"]
legion = ["dep:legion"]

[dependencies]
cgmath = "0.18"
glam = { workspace = true }
rayon = "1.4"
log = { workspace = true }

# Apex ECS
apex-core = { path = "../apex-core" }
apex-scheduler = { path = "../apex-scheduler" }
apex-macros = { path = "../apex-macros" }

# ECS under test (current released versions — fair comparison vs modern engines)
bevy_ecs = { version = "0.18", optional = true, features = ["multi_threaded"] }
bevy_tasks = { version = "0.18", optional = true }
legion = { version = "0.4", optional = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "benchmarks"
harness = false
