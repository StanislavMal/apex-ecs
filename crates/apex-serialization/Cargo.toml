[package]
name = "apex-serialization"
publish = false
version.workspace = true
edition.workspace = true

[dependencies]
apex-core  = { path = "../apex-core" }

serde         = { version = "1.0", features = ["derive"] }
# `raw_value`: a JSON payload is carried into the text document verbatim.
serde_json    = { workspace = true, features = ["raw_value"] }
# Legacy reader only (documents of wire v3 and older), removed with engine TD-608.
bincode.workspace   = true
rustc-hash.workspace = true
thiserror.workspace  = true
log.workspace        = true

[dev-dependencies]
# Tests write to disk only through a directory their Drop removes (engine TD-564).
apex-test-dir = { path = "../apex-test-dir" }
